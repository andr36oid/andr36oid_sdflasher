name: Android emulator checks
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Build run containing android-test-inputs
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {api: 23, arch: x86, target: default, pages: 4096}
          - {api: 35, arch: x86_64, target: default, pages: 4096}
          - {api: 35, arch: x86_64, target: google_apis_ps16k, pages: 16384, experimental: true}
    # The 16 KiB-page google_apis_ps16k system image boots unreliably on hosted
    # runners (the emulator often reports the device offline and dies before the
    # smoke script runs), so keep that one leg non-blocking and the release still
    # publishes. The actual 16 KiB-page guarantee is enforced statically in the
    # android build job (max-page-size=16384 link flags, zipalign -P 16 -c, and
    # scripts/check-android-apk.py asserting 16 KiB-aligned load segments and
    # RELRO), so this leg is runtime signal, not the gate.
    continue-on-error: ${{ matrix.experimental || false }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-test-inputs
          path: apks
          run-id: ${{ inputs.artifact_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_PAGE_SIZE: ${{ matrix.pages }}
        with:
          api-level: ${{ matrix.api }}
          arch: ${{ matrix.arch }}
          target: ${{ matrix.target }}
          disable-animations: true
          ram-size: 4096M
          emulator-boot-timeout: 900
          # android-emulator-runner v2 dropped the standalone "gpu" input, so pass
          # software rendering through emulator-options or it is silently ignored.
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none
          script: bash scripts/test-android.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke-${{ matrix.api }}-${{ matrix.pages }}
          path: |
            instrumentation*.txt
            android-logcat.txt
