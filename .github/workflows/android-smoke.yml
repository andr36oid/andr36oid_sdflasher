name: Android emulator checks
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Build run containing android-test-inputs
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {api: 23, arch: x86, target: default, pages: 4096}
          - {api: 35, arch: x86_64, target: default, pages: 4096}
          - {api: 35, arch: x86_64, target: google_apis_ps16k, pages: 16384}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-test-inputs
          path: apks
          run-id: ${{ inputs.artifact_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_PAGE_SIZE: ${{ matrix.pages }}
        with:
          api-level: ${{ matrix.api }}
          arch: ${{ matrix.arch }}
          target: ${{ matrix.target }}
          disable-animations: true
          ram-size: 4096M
          gpu: swiftshader_indirect
          script: bash scripts/test-android.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke-${{ matrix.api }}-${{ matrix.pages }}
          path: |
            instrumentation*.txt
            android-logcat.txt
